# A server and a client on different workers, in the ambient mesh. The
# namespace spire-e2e is registered in SPIRE; spire-e2e-unregistered is in the
# mesh too but has no registration, so its pods get no SVID.
---
apiVersion: v1
kind: Namespace
metadata:
  name: spire-e2e
  labels:
    istio.io/dataplane-mode: ambient
---
apiVersion: v1
kind: Namespace
metadata:
  name: spire-e2e-unregistered
  labels:
    istio.io/dataplane-mode: ambient
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: server
  namespace: spire-e2e
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: client
  namespace: spire-e2e
---
apiVersion: v1
kind: Pod
metadata:
  name: server
  namespace: spire-e2e
  labels:
    app: server
spec:
  serviceAccountName: server
  nodeSelector:
    kubernetes.io/hostname: ztunnel-spire-worker2
  containers:
    - name: server
      image: registry.k8s.io/e2e-test-images/agnhost:2.56
      args: ["netexec", "--http-port=8080"]
      ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: server
  namespace: spire-e2e
spec:
  selector:
    app: server
  ports:
    - port: 8080
---
apiVersion: v1
kind: Pod
metadata:
  name: client
  namespace: spire-e2e
spec:
  serviceAccountName: client
  nodeSelector:
    kubernetes.io/hostname: ztunnel-spire-worker
  containers:
    - name: client
      image: docker.io/curlimages/curl:8.17.0
      command: ["sleep", "infinity"]
---
apiVersion: v1
kind: Pod
metadata:
  name: client
  namespace: spire-e2e-unregistered
spec:
  nodeSelector:
    kubernetes.io/hostname: ztunnel-spire-worker
  containers:
    - name: client
      image: docker.io/curlimages/curl:8.17.0
      command: ["sleep", "infinity"]
