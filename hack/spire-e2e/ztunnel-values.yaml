# Values of the Istio ztunnel chart (1.32.0) that switch ztunnel to SPIRE.
# run.sh sets `image` to the image under test.
env:
  SPIRE_ENABLED: "true"
  SPIRE_ADMIN_ENDPOINT_SOCKET: unix:///run/spire/admin/admin.sock
  CONTAINER_RUNTIME_SOCK_PATH: /run/containerd/containerd.sock
  # One request per HBONE connection, so each request makes a new mTLS
  # handshake and the renewal check exercises every new certificate.
  POOL_MAX_STREAMS_PER_CONNECTION: "1"
volumes:
  # ztunnel is installed before SPIRE, as the cloud-provider does, so the
  # directory may not exist yet. The SPIRE agent mounts it the same way.
  - name: spire-admin
    hostPath:
      path: /run/spire/agent/sockets/csi.spiffe.io/admin
      type: DirectoryOrCreate
  - name: containerd
    hostPath:
      path: /run/containerd/containerd.sock
      type: Socket
volumeMounts:
  - name: spire-admin
    mountPath: /run/spire/admin
    readOnly: true
  - name: containerd
    mountPath: /run/containerd/containerd.sock
    readOnly: true
